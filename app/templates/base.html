<!doctype html>
<html lang="es" class="{% block html_class %}{% endblock %}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}WAKI{% endblock %}</title>
    {% block head %}{% endblock %}
    <link rel="stylesheet" href="{{ url_for('static', path='css/base.css').path }}">
    <link rel="stylesheet" href="{{ url_for('static', path='css/site.css').path }}">
    {% block styles %}{% endblock %}
    <link rel="stylesheet" href="{{ url_for('static', path='css/header.css').path }}">
  </head>
  <body class="{% block body_class %}{% endblock %}">
    {% include "shared/header.html" %}
    {% block content %}{% endblock %}
    {% include "shared/dialogs.html" %}
    {% block scripts %}{% endblock %}
    <script type="module" src="{{ url_for('static', path='js/site/index.js').path }}"></script>
  </body>
</html>
