<!-- BEGIN: MainHeader -->
<header class="bg-white border-b border-slate-200/80 sticky top-0 z-30 px-4 lg:px-6 py-2.5">
  <div class="max-w-[1920px] mx-auto flex items-center justify-between gap-4">
    <!-- Brand & Search Bar -->
    <div class="flex items-center flex-1 min-w-0 max-w-xl gap-4">
      <!-- Logo / Platform identity badge -->
      <div class="flex items-center gap-2 pr-2">
        <div class="w-8 h-8 rounded-lg bg-sky-600 flex items-center justify-center text-white font-bold text-sm shadow-sm">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path d="M13 10V3L4 14h7v7l9-11h-7z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
          </svg>
        </div>
        <span class="font-bold text-slate-900 tracking-tight text-base hidden sm:inline-block">WAKI<span class="text-sky-600 font-semibold text-xs ml-1 px-1.5 py-0.5 rounded bg-sky-50 border border-sky-100">GEO</span></span>
      </div>
      <!-- Search Input -->
      <div class="relative w-full min-w-0">
        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
          </svg>
        </div>
        <input class="w-full min-w-0 pl-8 pr-2 sm:pl-10 sm:pr-10 py-1.5 text-sm bg-slate-100/75 hover:bg-slate-100 focus:bg-white border-none rounded-xl text-slate-700 placeholder-slate-400 focus:ring-2 focus:ring-sky-500 transition-all" id="global-search" placeholder="Buscar río o estación..." aria-label="Buscar río o estación" type="text"/>
        <div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none">
          <kbd class="hidden sm:inline-block px-1.5 py-0.5 text-[10px] font-medium text-slate-400 bg-white border border-slate-200 rounded shadow-xs">⌘K</kbd>
        </div>
      </div>
    </div>
    <!-- Right Actions: Notifications, Profile, Settings -->
    <div class="flex items-center gap-2 sm:gap-4 shrink-0">
      <a href="{{ url_for('reports_list').path }}" class="inline-flex items-center px-3 py-2 rounded-xl text-sky-700 bg-sky-50 text-xs font-semibold hover:bg-sky-100">Reportes</a>
      <a href="{{ url_for('citizen_report').path }}" class="inline-flex items-center px-3 py-2 rounded-xl bg-sky-600 text-white text-xs font-semibold hover:bg-sky-700">Reportar <span class="hidden sm:inline ml-1">observación</span></a>
      <!-- Notification button with active alert indicator -->
      <button aria-label="Ver notificaciones" class="hidden sm:block relative p-2 text-slate-500 hover:text-slate-800 hover:bg-slate-100 rounded-xl transition-colors" type="button">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
        </svg>
        <span class="absolute top-1.5 right-1.5 w-2 h-2 rounded-full bg-red-500 ring-2 ring-white"></span>
      </button>
      <!-- Divider -->
      <div class="h-6 w-px bg-slate-200 hidden sm:block"></div>
      <!-- User/Team profile chip -->
      <div class="flex items-center gap-2.5 pl-1 py-1 pr-2 rounded-full hover:bg-slate-100 transition-colors cursor-pointer" data-purpose="user-profile">
        <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-sky-600 to-indigo-600 flex items-center justify-center text-white text-xs font-semibold shadow-xs">
          EW
        </div>
        <div class="text-left hidden md:block">
          <p class="text-xs font-semibold text-slate-800 leading-tight">Equipo WAKI</p>
          <p class="text-[11px] text-slate-500 leading-none">Hidrología Perú</p>
        </div>
        <svg class="w-4 h-4 text-slate-400 hidden sm:block" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path d="M19 9l-7 7-7-7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
        </svg>
      </div>
      <!-- Settings icon -->
      <button aria-label="Configuración" class="hidden sm:block p-2 text-slate-500 hover:text-slate-800 hover:bg-slate-100 rounded-xl transition-colors" type="button">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
          <path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
        </svg>
      </button>
    </div>
  </div>
</header>
<!-- END: MainHeader -->
