<section class="md:col-span-5 bg-slate-50 border border-slate-200/70 rounded-xl p-3.5 flex flex-col gap-3" id="water-level-card" aria-label="Nivel publicado por la estación" aria-busy="true">
  <div>
    <h4 class="text-xs font-semibold text-slate-500 uppercase tracking-wide">Último nivel publicado</h4>
    <p class="text-xs font-semibold text-slate-800 mt-2" id="water-level-station">Consultando estación…</p>
    <p class="text-[11px] text-slate-500 mt-1" id="water-level-metric">Promedio diario · SENAMHI</p>
    <p class="text-3xl font-extrabold text-slate-900 tracking-tight mt-2" id="current-water-level">—</p>
    <p class="text-xs text-slate-600 mt-1" id="water-level-date"></p>
    <p class="text-[11px] text-sky-800 mt-2" id="level-delta-text" hidden></p>
  </div>
  <div id="water-level-chart" hidden>
    <p class="text-[10px] text-slate-500 font-medium mb-1">Promedios diarios publicados</p>
    <svg class="w-full h-20" id="water-level-sparkline" viewBox="0 0 280 80" role="img" aria-label="Serie de promedios diarios en metros">
      <title id="water-level-chart-title">Serie de niveles diarios</title>
      <path id="sparkline-path" fill="none" stroke="#0284c7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
      <g id="water-level-points"></g>
    </svg>
    <div class="flex justify-between text-[10px] text-slate-500 mt-1">
      <span id="water-level-start-date"></span><span id="water-level-end-date"></span>
    </div>
  </div>
  <div class="text-[11px] leading-relaxed text-slate-600 mt-auto">
    <p id="water-level-status" role="status">Cargando niveles publicados…</p>
    <p id="water-level-checked" class="text-slate-500 mt-1"></p>
    <p id="water-level-scope" class="mt-1" hidden>La medición corresponde a esta estación, no a todo el tramo.</p>
    <div class="flex flex-wrap items-center gap-3 mt-2">
      <a id="water-level-source" class="text-sky-700 underline" target="_blank" rel="noopener noreferrer" hidden>Fuente: SENAMHI</a>
      <button id="water-level-retry" class="text-sky-700 underline" type="button" hidden>Volver a consultar</button>
      <button class="measurement-history-button" type="button" data-history-kind="level">Ver histórico en tabla</button>
    </div>
  </div>
</section>
