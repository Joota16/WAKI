<article class="bg-white rounded-2xl border border-slate-200/80 shadow-xs p-4 sm:p-5" data-purpose="priority-stretches-list">

    </div>
    <button class="inline-flex items-center text-xs font-semibold text-sky-600 hover:text-sky-700 group transition-colors" data-map-action="recenter">

          <td class="py-3 pr-2 text-right text-xs text-slate-500 whitespace-nowrap">
