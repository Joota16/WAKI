<!-- BEGIN: StretchDetailCard -->
<article class="bg-white rounded-2xl border border-slate-200/80 shadow-xs p-4 sm:p-5 flex-1 flex flex-col justify-between" data-purpose="stretch-detailed-card" id="detalle-chillon">
  <!-- Header Info & Alert Badge -->
  <div>
    <div class="flex items-start justify-between gap-3 mb-3">
      <div>
        <div class="flex items-center gap-2">
          <h3 class="text-lg sm:text-xl font-bold text-slate-900 tracking-tight" id="card-river-title">Río Chillón – Tramo Comas</h3>
        </div>
        <p class="text-xs text-slate-500 mt-0.5" id="card-river-station">Estación Telemétrica Puente Comas • Cuenca Chillón</p>
      </div>
      <span class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-bold bg-red-600 text-white shadow-sm shrink-0" id="card-river-badge">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
        </svg>
        <span id="card-river-badge-text">Riesgo Alto</span>
      </span>
    </div>
    <!-- Secondary Tabs Navigation -->
    <div class="flex items-center border-b border-slate-200 overflow-x-auto text-xs font-medium text-slate-500 gap-6 mb-4" id="detail-tabs">
      <button class="tab-button py-2 border-b-2 border-sky-600 text-sky-600 font-semibold whitespace-nowrap transition-colors" id="tab-btn-resumen" data-tab="resumen">Resumen</button>
      <button class="tab-button py-2 border-b-2 border-transparent hover:text-slate-900 whitespace-nowrap transition-colors" id="tab-btn-imagenes" data-tab="imagenes">Imágenes</button>
      <button class="tab-button py-2 border-b-2 border-transparent hover:text-slate-900 whitespace-nowrap transition-colors" id="tab-btn-reportes" data-tab="reportes">Reportes ciudadanos</button>
    </div>
    <!-- TAB PANELS CONTAINER -->
    {% include "dashboard/tabs/overview.html" %}
    {% include "dashboard/tabs/images.html" %}
    {% include "dashboard/tabs/reports.html" %}
  </div>
</article>
<!-- END: StretchDetailCard -->
