<dialog id="analysis-report-dialog" class="analysis-report-dialog" aria-labelledby="analysis-dialog-title">
  <header class="analysis-dialog-header">
    <h2 id="analysis-dialog-title">Informe de análisis visual</h2>
    <button id="analysis-dialog-close" type="button" aria-label="Cerrar informe" autofocus>Cerrar ×</button>
  </header>
  <div class="analysis-dialog-body">
    <p id="analysis-dialog-status" role="status" aria-live="polite">Cargando informe…</p>
    <button id="analysis-dialog-retry" type="button" hidden>Reintentar</button>
    <div id="analysis-dialog-content" hidden></div>
  </div>
</dialog>
