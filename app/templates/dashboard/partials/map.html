<!-- BEGIN: LeftMapColumn -->
<section aria-label="Visualizador cartográfico interactivo de riesgo" class="lg:col-span-6 xl:col-span-6 flex flex-col rounded-2xl overflow-hidden border border-slate-200/80 bg-slate-900 shadow-sm relative min-h-[580px] lg:min-h-full">
  <!-- Top Floating Map Toolbar -->
  <div class="absolute top-3 left-3 right-3 z-[1000] flex flex-wrap items-center justify-between gap-2 pointer-events-none">
    <!-- Category Toggle Pill -->
    <div class="pointer-events-auto bg-white/95 backdrop-blur-md p-1 rounded-xl shadow-lg border border-slate-200/60 flex items-center gap-1 text-xs font-medium" id="map-mode-toggle">
      <button class="px-3 py-1.5 rounded-lg bg-sky-600 text-white font-medium shadow-xs transition-colors" id="mode-risk" data-map-mode="risk">
        Riesgo de inundación
      </button>
      <button class="px-3 py-1.5 rounded-lg text-slate-600 hover:text-slate-900 hover:bg-slate-100 transition-colors" id="mode-reports" data-map-mode="reports">
        Reportes recientes
      </button>
    </div>
    <!-- Cartography & Layer Controls -->
    <div class="pointer-events-auto flex flex-wrap items-center gap-1.5">
      <button id="btn-show-stations" data-map-action="stations" type="button" class="bg-white/95 px-3 py-2 rounded-xl shadow-lg border border-slate-200/60 text-xs font-semibold text-violet-700 hover:bg-white">Ver estaciones</button>
      <div class="bg-white/95 backdrop-blur-md px-3 py-1.5 rounded-xl shadow-lg border border-slate-200/60 flex items-center gap-2 text-xs font-medium text-slate-700">
        <svg class="w-3.5 h-3.5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path d="M3 6c4-4 5 4 9 0s5 4 9 0M3 12c4-4 5 4 9 0s5 4 9 0M3 18c4-4 5 4 9 0s5 4 9 0" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
        </svg>
        <span id="river-geometry-status" role="status">Cargando cauces…</span>
        <button id="retry-river-geometry" type="button" class="text-sky-700 underline" hidden>Reintentar</button>
      </div>
      <button aria-label="Recentrar mapa" class="bg-white/95 backdrop-blur-md p-2 rounded-xl shadow-lg border border-slate-200/60 text-slate-700 hover:text-slate-950 hover:bg-white transition-colors" id="btn-recenter" data-map-action="recenter" title="Recentrar Lima">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path d="M12 2v4m0 12v4M2 12h4m12 0h4m-7-5a3 3 0 11-6 0 3 3 0 016 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
        </svg>
      </button>
    </div>
  </div>
  <!-- Leaflet Map Container -->
  <div class="w-full h-full min-h-[560px] z-10" id="map"></div>
  <!-- Legend Card (Bottom-Left) -->
  <div class="absolute bottom-3 left-3 z-[1000] flex flex-col gap-2 pointer-events-auto">
    <div id="map-risk-legend" class="bg-white/95 backdrop-blur-md p-3 rounded-xl shadow-lg border border-slate-200/70 text-xs w-44">
      <p class="font-semibold text-slate-900 mb-2 text-[11px] uppercase tracking-wider">Nivel de riesgo por tramo</p>
      <div class="space-y-1.5 font-medium text-slate-700 text-[11px]">
        <div class="flex items-center gap-2">
          <span class="w-5 h-1.5 rounded-full bg-red-500"></span>
          <span>Alto</span>
        </div>
        <div class="flex items-center gap-2">
          <span class="w-5 h-1.5 rounded-full bg-amber-500"></span>
          <span>Medio</span>
        </div>
        <div class="flex items-center gap-2">
          <span class="w-5 h-1.5 rounded-full bg-yellow-400"></span>
          <span>Bajo</span>
        </div>
        <div class="flex items-center gap-2">
          <span class="w-5 h-1.5 rounded-full bg-emerald-500"></span>
          <span>Sin riesgo</span>
        </div>
      </div>
    </div>
    <div class="bg-white/95 backdrop-blur-md px-3 py-2 rounded-xl shadow-lg border border-slate-200/70 text-xs flex items-center gap-2">
      <span class="hydro-station-legend" aria-hidden="true">EH</span>
      <span>Estaciones hidrológicas</span>
    </div>
  </div>
  <!-- Zoom Controls (Bottom-Right) -->
  <div class="absolute bottom-3 right-3 z-[1000] flex flex-col gap-1 bg-white/95 backdrop-blur-md rounded-xl p-1 shadow-lg border border-slate-200/70 pointer-events-auto">
    <button aria-label="Acercar mapa" class="w-8 h-8 flex items-center justify-center rounded-lg hover:bg-slate-100 text-slate-700 font-bold transition-colors" data-map-action="zoom-in">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M12 4v16m8-8H4" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
    </button>
    <div class="h-px bg-slate-200"></div>
    <button aria-label="Alejar mapa" class="w-8 h-8 flex items-center justify-center rounded-lg hover:bg-slate-100 text-slate-700 font-bold transition-colors" data-map-action="zoom-out">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M20 12H4" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
    </button>
  </div>
</section>
<!-- END: LeftMapColumn -->
