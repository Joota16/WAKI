<div class="tab-panel hidden flex flex-col gap-4" id="tab-panel-imagenes" data-cameras='{{ camera_ids | tojson }}'>
  <div>
    <h4 class="font-bold text-sm text-slate-800">Capturas y análisis de IA</h4>
    <p id="analyses-capture-frequency" class="text-xs text-slate-600 mt-1">La cámara está programada para capturar cada {{ camera_capture_seconds }} segundos, si tiene conexión. Los informes se consultan cada 5 segundos.</p>
  </div>
  {% include "dashboard/partials/analysis-upload.html" %}
  <div class="flex flex-wrap gap-2" role="group" aria-label="Origen de las imágenes">
    <button type="button" class="analysis-source-option" data-analysis-source="iot" aria-pressed="true">Cámara</button>
    <button type="button" class="analysis-source-option" data-analysis-source="test" aria-pressed="false">Pruebas manuales</button>
  </div>
  <p id="analyses-status" role="status" aria-live="polite" class="text-sm text-slate-600">Consultando análisis…</p>
  <div id="analyses-gallery" class="grid grid-cols-1 sm:grid-cols-2 gap-4"></div>
  <nav aria-label="Páginas de capturas" class="flex items-center justify-between gap-3 text-xs">
    <button id="analyses-previous" type="button" disabled class="px-3 py-2 rounded-lg border border-slate-200 disabled:opacity-40">Anteriores</button>
    <span id="analyses-page" class="text-slate-500"></span>
    <button id="analyses-next" type="button" disabled class="px-3 py-2 rounded-lg border border-slate-200 disabled:opacity-40">Siguientes</button>
  </nav>
  <template id="analysis-card-template">
    <article class="rounded-xl border border-slate-200 bg-white overflow-hidden flex flex-col">
      <div class="aspect-video bg-slate-950 flex items-center justify-center relative">
        <img data-analysis-image class="absolute inset-0 w-full h-full object-contain" hidden alt="Captura de la cámara">
        <p data-analysis-image-status class="text-xs text-slate-300 p-4">Cargando fotografía…</p>
      </div>
      <div class="p-3 flex flex-col gap-2 text-xs">
        <p data-analysis-camera class="font-semibold text-slate-800"></p>
        <time data-analysis-time class="text-slate-500"></time>
        <p data-analysis-state class="font-semibold text-sky-700"></p>
        <p data-analysis-summary class="text-slate-600"></p>
        <p data-analysis-message class="text-slate-500"></p>
        <p data-analysis-load-time class="text-slate-500"></p>
        <div class="flex flex-wrap gap-3 mt-auto items-center">
          <button type="button" data-analysis-toggle class="text-sky-700 underline disabled:opacity-50">Ver original</button>
          <button type="button" data-analysis-report aria-haspopup="dialog" aria-controls="analysis-report-dialog" class="rounded-lg bg-sky-600 text-white px-3 py-2 font-semibold">Ver informe IA</button>
        </div>
      </div>
    </article>
  </template>
</div>
