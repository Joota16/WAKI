<!-- SECCIÓN 1: ¿DÓNDE VISTE EL PROBLEMA? -->
<div class="bg-surface-container-lowest rounded-2xl p-6 shadow-sm border border-outline-variant/20 flex flex-col gap-4">
  <div class="flex items-center gap-3">
    <span class="w-8 h-8 rounded-xl bg-primary-container/20 text-primary font-bold flex items-center justify-center text-sm">1</span>
    <div>
      <h2 class="font-headline-sm text-headline-sm text-on-surface">¿Dónde viste el problema?</h2>
      <p class="text-xs text-on-surface-variant">Selecciona el río y la zona donde hiciste la observación.</p>
    </div>
  </div>
  <div class="grid grid-cols-1 md:grid-cols-2 gap-4 pt-1">
    <div class="flex flex-col gap-1.5">
      <label class="font-label-md text-label-md text-on-surface font-semibold" for="cuencaSelect">
        ¿Qué río es? <span class="text-error">*</span>
      </label>
      <div class="relative">
        <select class="w-full h-12 px-3.5 bg-surface-container-low rounded-xl text-on-surface font-body-md text-body-md focus:bg-surface-container-lowest focus:outline-none focus:ring-2 focus:ring-primary appearance-none cursor-pointer border border-transparent focus:border-primary" id="cuencaSelect" required="">
          <option disabled="" selected="" value="">Selecciona tu río...</option>
          <option value="Río Chillón">Río Chillón (Lima Norte: Carabayllo, Comas, Puente Piedra, SMP, Callao)</option>
          <option value="Río Rímac">Río Rímac (Chosica, Chaclacayo, Huachipa, Cercado de Lima, San Juan de Lurigancho)</option>
        </select>
        <span class="material-symbols-outlined absolute right-3.5 top-3.5 pointer-events-none text-on-surface-variant text-[20px]">expand_more</span>
      </div>
    </div>
    <div class="flex flex-col gap-1.5">
      <label class="font-label-md text-label-md text-on-surface font-semibold" for="distritoInput">
        Distrito o Localidad <span class="text-error">*</span>
      </label>
      <input class="w-full h-12 px-3.5 bg-surface-container-low rounded-xl text-on-surface font-body-md text-body-md focus:bg-surface-container-lowest focus:outline-none focus:ring-2 focus:ring-primary border border-transparent focus:border-primary" id="distritoInput" maxlength="120" placeholder="Ej: Comas / Carabayllo / Chosica" required="" type="text"/>
    </div>
  </div>
  <div class="flex flex-col gap-1.5">
    <label class="font-label-md text-label-md text-on-surface font-semibold" for="referenciaVecinal">
      Puente, calle o referencia conocida por los vecinos <span class="text-error">*</span>
    </label>
    <input class="w-full h-12 px-3.5 bg-surface-container-low rounded-xl text-on-surface font-body-md text-body-md focus:bg-surface-container-lowest focus:outline-none focus:ring-2 focus:ring-primary border border-transparent focus:border-primary" id="referenciaVecinal" maxlength="300" placeholder="Ej: A 50 metros del Puente Trapiche, frente al mercado o parque..." required="" type="text"/>
    <span class="text-xs text-on-surface-variant">Menciona puntos conocidos (paraderos, colegios, puentes, asentamiento humano) para una respuesta rápida.</span>
  </div>
</div>
