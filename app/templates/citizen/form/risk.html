<!-- SECCIÓN 1: ¿QUÉ NIVEL DE PELIGRO VES? -->
<div class="bg-surface-container-lowest rounded-2xl p-6 shadow-sm border border-outline-variant/20 flex flex-col gap-4">
  <div class="flex items-center justify-between flex-wrap gap-2">
    <div class="flex items-center gap-3">
      <span class="w-8 h-8 rounded-xl bg-primary-container/20 text-primary font-bold flex items-center justify-center text-sm">1</span>
      <div>
        <h2 class="font-headline-sm text-headline-sm text-on-surface">¿Qué nivel de peligro ves en este momento?</h2>
      </div>
    </div>
    <span class="citizen-risk-badge px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wide" id="badgeActiveRisk">
      Selecciona una condición
    </span>
  </div>
  <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5 pt-1" id="riskCardsGroup">
    <!-- TARJETA ROJA: CRÍTICO -->
    <label class="citizen-risk-card cursor-pointer relative p-4 rounded-xl transition-all flex flex-col gap-2" data-label="Peligro Inminente / Desborde" data-risk="critico">
      <input class="sr-only" name="nivelPeligro" required type="radio" value="critico"/>
      <span class="font-title-md text-label-md font-bold text-on-surface">Peligro Inminente / Desborde</span>
    </label>
    <!-- TARJETA NARANJA: MUY ALTO -->
    <label class="citizen-risk-card cursor-pointer relative p-4 rounded-xl transition-all flex flex-col gap-2" data-label="Nivel Muy Alto" data-risk="muy-alto">
      <input class="sr-only" name="nivelPeligro" required type="radio" value="muy-alto"/>
      <span class="font-title-md text-label-md font-bold text-on-surface">Nivel Muy Alto</span>
    </label>
    <!-- TARJETA AMARILLA: ALTO / CRECIDA -->
    <label class="citizen-risk-card cursor-pointer relative p-4 rounded-xl transition-all flex flex-col gap-2" data-label="Nivel Alto / Crecida" data-risk="alto">
      <input class="sr-only" name="nivelPeligro" required type="radio" value="alto"/>
      <span class="font-title-md text-label-md font-bold text-on-surface">Nivel Alto / Crecida</span>
    </label>
    <!-- TARJETA VERDE: NORMAL -->
    <label class="citizen-risk-card cursor-pointer relative p-4 rounded-xl transition-all flex flex-col gap-2" data-label="Normal / Sin Peligro" data-risk="normal">
      <input class="sr-only" name="nivelPeligro" required type="radio" value="normal"/>
      <span class="font-title-md text-label-md font-bold text-on-surface">Normal / Sin Peligro</span>
    </label>
  </div>
</div>
